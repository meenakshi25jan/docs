version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - dnastoreai_data:/app/backend/data
    environment:
      - DNASTORE_DATABASE_URL=postgresql+asyncpg://dnastoreai:dnastoreai@postgres:5432/dnastoreai
      - DNASTORE_DEBUG=false
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dnastoreai
      POSTGRES_PASSWORD: dnastoreai
      POSTGRES_DB: dnastoreai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dnastoreai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dnastoreai_data:
  postgres_data:
