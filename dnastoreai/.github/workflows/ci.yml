name: CI

on:
  push:
    branches: [main, 'cursor/**']
    paths: ['dnastoreai/**']
  pull_request:
    branches: [main]
    paths: ['dnastoreai/**']

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dnastoreai/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check dnastoreai tests

      - name: Format check with black
        run: black --check dnastoreai tests

      - name: Run tests with coverage
        run: pytest tests/ --cov=dnastoreai --cov-fail-under=90 -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dnastoreai/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dnastoreai/frontend/package-lock.json

      - name: Install and build
        run: |
          npm install
          npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker compose -f dnastoreai/docker-compose.yml build
