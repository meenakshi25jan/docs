name: CD

on:
  push:
    branches: [main]
    paths:
      - 'ai-english-teacher/**'

defaults:
  run:
    working-directory: ai-english-teacher

env:
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
  AKS_CLUSTER: ai-english-teacher-aks
  AKS_RESOURCE_GROUP: ai-english-teacher-prod-rg

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push images
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}
          docker build -t $ACR_REGISTRY/ai-english-teacher-backend:${{ github.sha }} ./backend
          docker build -t $ACR_REGISTRY/ai-english-teacher-frontend:${{ github.sha }} ./frontend
          docker push $ACR_REGISTRY/ai-english-teacher-backend:${{ github.sha }}
          docker push $ACR_REGISTRY/ai-english-teacher-frontend:${{ github.sha }}

      - name: Deploy to AKS
        run: |
          az aks get-credentials --resource-group $AKS_RESOURCE_GROUP --name $AKS_CLUSTER
          export IMAGE_TAG=${{ github.sha }}
          export ACR_REGISTRY=${{ secrets.ACR_REGISTRY }}
          envsubst < k8s/base/deployment.yaml | kubectl apply -f -
          kubectl rollout status deployment/backend -n ai-english-teacher
          kubectl rollout status deployment/frontend -n ai-english-teacher

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Promote to production
        run: |
          az aks get-credentials --resource-group $AKS_RESOURCE_GROUP --name $AKS_CLUSTER
          kubectl set image deployment/backend backend=$ACR_REGISTRY/ai-english-teacher-backend:${{ github.sha }} -n ai-english-teacher
          kubectl set image deployment/frontend frontend=$ACR_REGISTRY/ai-english-teacher-frontend:${{ github.sha }} -n ai-english-teacher
