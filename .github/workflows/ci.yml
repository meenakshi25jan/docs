# GitOps CI for AI English Teacher
#
# Triggers on PRs (all branches) and pushes to develop/main.
# Push to main is required so post-merge CI runs on main before deploy workflow_run fires.

name: AI English Teacher CI

on:
  pull_request:
    paths:
      - 'ai-english-teacher/**'
      - 'render.yaml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy.yml'
  push:
    branches: [main, develop]
    paths:
      - 'ai-english-teacher/**'
      - 'render.yaml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy.yml'

concurrency:
  group: ai-english-teacher-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: read

env:
  BACKEND_DIR: ai-english-teacher/backend
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    name: Lint (flake8, black, isort)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.BACKEND_DIR }}/requirements-ci.txt
      - name: Install dependencies
        run: pip install -r ${{ env.BACKEND_DIR }}/requirements-ci.txt
      - name: flake8
        working-directory: ${{ env.BACKEND_DIR }}
        run: flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: black --check
        working-directory: ${{ env.BACKEND_DIR }}
        run: black --check app
      - name: isort --check
        working-directory: ${{ env.BACKEND_DIR }}
        run: isort --check-only app

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.BACKEND_DIR }}/requirements-ci.txt
      - name: Install dependencies
        run: pip install -r ${{ env.BACKEND_DIR }}/requirements-ci.txt
      - name: mypy
        working-directory: ${{ env.BACKEND_DIR }}
        run: mypy app

  unit-tests:
    name: Unit tests (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.BACKEND_DIR }}/requirements-ci.txt
      - name: Install dependencies
        run: pip install -r ${{ env.BACKEND_DIR }}/requirements-ci.txt
      - name: pytest with coverage (threshold 65%)
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          JWT_SECRET: ci-test-secret
          DATABASE_URL: sqlite+aiosqlite:///:memory:
        run: |
          pytest app/tests/test_auth.py app/tests/test_conversation.py \
            --cov=app --cov-report=term-missing --cov-fail-under=65 -v

  integration-tests:
    name: Integration tests (Postgres + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.BACKEND_DIR }}/requirements-ci.txt
      - name: Install dependencies
        run: pip install -r ${{ env.BACKEND_DIR }}/requirements-ci.txt
      - name: Enable pgvector extension
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d test_db -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Run integration tests
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          JWT_SECRET: ci-test-secret
          INTEGRATION_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
        run: pytest app/tests/test_integration_db.py -v

  migration-check:
    name: Migration check (upgrade / downgrade / upgrade)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migration_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.BACKEND_DIR }}/requirements-ci.txt
      - name: Install dependencies
        run: pip install -r ${{ env.BACKEND_DIR }}/requirements-ci.txt
      - name: Alembic round-trip
        env:
          JWT_SECRET: ci-migration-secret
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/migration_db
        run: bash ai-english-teacher/scripts/ci_migration_roundtrip.sh

  security-scan:
    name: Security scan (pip-audit + gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: pip-audit
        run: |
          pip install pip-audit==2.7.3
          IGNORE_ARGS=""
          while IFS= read -r id; do
            [[ -z "$id" || "$id" =~ ^# ]] && continue
            IGNORE_ARGS="$IGNORE_ARGS --ignore-vuln $id"
          done < ${{ env.BACKEND_DIR }}/.pip-audit-ignore
          pip-audit -r ${{ env.BACKEND_DIR }}/requirements.txt $IGNORE_ARGS
      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Gitleaks
        run: gitleaks detect --source ai-english-teacher --config ai-english-teacher/.gitleaks.toml --redact --no-banner

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          docker build \
            --build-arg BUILD_COMMIT_SHA=${{ github.sha }} \
            -f ${{ env.BACKEND_DIR }}/Dockerfile \
            -t ghcr.io/${{ github.repository_owner }}/ai-english-teacher-api:${{ github.sha }} \
            ${{ env.BACKEND_DIR }}

  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests, integration-tests, migration-check, security-scan, docker-build]
    if: always()
    steps:
      - name: Require all CI gates
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.integration-tests.result }}" != "success" ] || \
             [ "${{ needs.migration-check.result }}" != "success" ] || \
             [ "${{ needs.security-scan.result }}" != "success" ] || \
             [ "${{ needs.docker-build.result }}" != "success" ]; then
            echo "CI failed — one or more required jobs did not succeed"
            exit 1
          fi
          echo "CI passed — all gates green"
