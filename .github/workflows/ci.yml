name: AI English Teacher CI

on:
  push:
    branches: [main, 'cursor/**']
    paths:
      - 'ai-english-teacher/**'
      - 'render.yaml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ai-english-teacher/**'
      - 'render.yaml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy.yml'

concurrency:
  group: ai-english-teacher-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate render.yaml
        run: python3 ai-english-teacher/scripts/validate_render_config.py
      - name: Check migration files on disk
        run: python3 ai-english-teacher/scripts/check_migrations.py

  backend:
    runs-on: ubuntu-latest
    needs: validate-config
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-english-teacher/backend/requirements.txt
      - name: Install backend dependencies
        working-directory: ai-english-teacher/backend
        run: pip install -r requirements.txt
      - name: Ruff / syntax check (import app)
        working-directory: ai-english-teacher/backend
        run: python3 -c "from app.main import app; print('app import OK')"
      - name: Run backend tests
        working-directory: ai-english-teacher/backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          JWT_SECRET_KEY: ci-test-secret
        run: pytest tests/ -q --tb=line

  frontend:
    runs-on: ubuntu-latest
    needs: validate-config
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ai-english-teacher/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: ai-english-teacher/frontend
        run: npm ci
      - name: Lint frontend
        working-directory: ai-english-teacher/frontend
        run: npm run lint
      - name: Build frontend and verify routes
        working-directory: ai-english-teacher/frontend
        run: |
          npm run build 2>&1 | tee build.log
          grep -q '/grammar-class' build.log || (echo "Missing /grammar-class route" && exit 1)

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ai-english-teacher
          severity: CRITICAL,HIGH
          exit-code: '0'

  ci-success:
    runs-on: ubuntu-latest
    needs: [backend, frontend, security]
    if: always()
    steps:
      - name: Require all jobs
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"
