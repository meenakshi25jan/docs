name: AI English Teacher CI

on:
  push:
    branches: [main, 'cursor/**']
    paths:
      - 'ai-english-teacher/**'
      - 'render.yaml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/migrate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ai-english-teacher/**'
      - 'render.yaml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/migrate.yml'

concurrency:
  group: ai-english-teacher-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate render.yaml
        run: python3 ai-english-teacher/scripts/validate_render_config.py
      - name: Validate environment configuration
        run: python3 ai-english-teacher/scripts/validate_environment.py
      - name: Check Alembic migrations
        run: python3 ai-english-teacher/scripts/check_migrations.py
      - name: Migration report
        run: python3 ai-english-teacher/scripts/migration_report.py

  backend-quality:
    runs-on: ubuntu-latest
    needs: validate-config
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-english-teacher/backend/requirements.txt
      - name: Install backend + lint tools
        run: |
          pip install -r ai-english-teacher/backend/requirements.txt
          pip install ruff==0.8.6 flake8==7.1.1
      - name: Backend lint
        run: bash ai-english-teacher/scripts/ci_lint_backend.sh

  backend-test:
    runs-on: ubuntu-latest
    needs: validate-config
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-english-teacher/backend/requirements.txt
      - name: Install backend dependencies
        working-directory: ai-english-teacher/backend
        run: pip install -r requirements.txt
      - name: Run Alembic migrations (Postgres smoke test)
        working-directory: ai-english-teacher/backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          JWT_SECRET: ci-test-secret
        run: alembic upgrade head
      - name: Run backend tests
        working-directory: ai-english-teacher/backend
        env:
          JWT_SECRET: ci-test-secret
          DATABASE_URL: sqlite+aiosqlite:///:memory:
        run: pytest -v --tb=short
      - name: OpenAPI import smoke test
        working-directory: ai-english-teacher/backend
        env:
          JWT_SECRET: ci-test-secret
        run: python -c "from app.main import app; assert app.openapi()"

  backend-docker:
    runs-on: ubuntu-latest
    needs: validate-config
    steps:
      - uses: actions/checkout@v4
      - name: Build backend Docker image
        run: docker build -f ai-english-teacher/backend/Dockerfile -t ai-english-teacher-api:ci ai-english-teacher/backend
      - name: Report image size
        run: docker images ai-english-teacher-api:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'

  frontend:
    runs-on: ubuntu-latest
    needs: validate-config
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ai-english-teacher/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: ai-english-teacher/frontend
        run: npm ci
      - name: Lint frontend
        working-directory: ai-english-teacher/frontend
        run: npm run lint
      - name: Typecheck frontend
        working-directory: ai-english-teacher/frontend
        run: npm run typecheck
      - name: Build frontend
        working-directory: ai-english-teacher/frontend
        run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Gitleaks secret scan (ai-english-teacher only)
        continue-on-error: true
        run: gitleaks detect --source ai-english-teacher --config ai-english-teacher/.gitleaks.toml --redact --no-banner

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  ci-success:
    runs-on: ubuntu-latest
    needs: [backend-quality, backend-test, backend-docker, security]
    if: always()
    steps:
      - name: Require critical jobs
        run: |
          if [ "${{ needs.backend-quality.result }}" != "success" ] || \
             [ "${{ needs.backend-test.result }}" != "success" ] || \
             [ "${{ needs.backend-docker.result }}" != "success" ]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"
