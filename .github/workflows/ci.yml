name: AI English Teacher CI

on:
  push:
    branches: [main, 'cursor/**']
    paths:
      - 'ai-english-teacher/**'
      - 'render.yaml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ai-english-teacher/**'
      - 'render.yaml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy.yml'

concurrency:
  group: ai-english-teacher-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate render.yaml
        run: python3 ai-english-teacher/scripts/validate_render_config.py
      - name: Check migration files on disk
        run: python3 ai-english-teacher/scripts/check_migrations.py
      - name: Migration report
        run: python3 ai-english-teacher/scripts/migration_report.py
      - name: Validate Dockerfiles
        run: python3 ai-english-teacher/scripts/validate_docker.py
      - name: Validate docker-compose
        run: python3 ai-english-teacher/scripts/validate_compose.py
      - name: Validate environment configuration
        run: python3 ai-english-teacher/scripts/validate_environment.py

  backend-quality:
    runs-on: ubuntu-latest
    needs: validate-config
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ai-english-teacher/backend/requirements-ci.txt
            ai-english-teacher/backend/requirements.txt
      - name: Install backend + CI tools
        working-directory: ai-english-teacher/backend
        run: pip install -r requirements-ci.txt
      - name: Backend lint and type check
        run: bash ai-english-teacher/scripts/ci_lint_backend.sh

  backend:
    runs-on: ubuntu-latest
    needs: validate-config
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-english-teacher/backend/requirements-ci.txt
      - name: Install backend dependencies
        working-directory: ai-english-teacher/backend
        run: pip install -r requirements-ci.txt
      - name: Validate connections and OpenAPI
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ci-test-secret
        run: python3 ai-english-teacher/scripts/validate_connections.py
      - name: Run backend tests with coverage
        working-directory: ai-english-teacher/backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          JWT_SECRET_KEY: ci-test-secret
          PYTHONPATH: ${{ github.workspace }}/ai-english-teacher/backend
        run: |
          python -m pytest tests/ -q --tb=line --cov=app --cov-report=term-missing --cov-fail-under=50

  frontend:
    runs-on: ubuntu-latest
    needs: validate-config
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ai-english-teacher/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: ai-english-teacher/frontend
        run: npm ci
      - name: Lint frontend
        working-directory: ai-english-teacher/frontend
        run: npm run lint
      - name: Typecheck frontend
        working-directory: ai-english-teacher/frontend
        run: npm run typecheck
      - name: Build frontend and verify routes
        working-directory: ai-english-teacher/frontend
        run: |
          npm run build
          test -f public/build-info.json
          test -f .next/standalone/frontend/public/build-info.json
          grep -q '/grammar-class' public/build-info.json
          npm run verify:routes
      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-manifest
          path: |
            ai-english-teacher/frontend/public/build-info.json
            ai-english-teacher/frontend/.next/app-path-routes-manifest.json
          if-no-files-found: error
          retention-days: 14

  docker-build:
    runs-on: ubuntu-latest
    needs: validate-config
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build backend Docker image
        run: docker build -f ai-english-teacher/backend/Dockerfile -t ai-english-teacher-api:ci ai-english-teacher
      - name: Build frontend Docker image
        run: docker build -f ai-english-teacher/frontend/Dockerfile -t ai-english-teacher-web:ci ai-english-teacher/frontend
      - name: Report image sizes
        run: |
          docker images ai-english-teacher-api:ci ai-english-teacher-web:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ai-english-teacher
          severity: CRITICAL,HIGH
          exit-code: '0'
          format: sarif
          output: trivy-results.sarif
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-ai-english-teacher
      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Gitleaks secret scan (ai-english-teacher only)
        continue-on-error: true
        run: gitleaks detect --source ai-english-teacher --config ai-english-teacher/.gitleaks.toml --redact --no-banner

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  ci-success:
    runs-on: ubuntu-latest
    needs: [backend-quality, backend, frontend, security]
    if: always()
    steps:
      - name: Require all jobs
        run: |
          if [ "${{ needs.backend-quality.result }}" != "success" ] || \
             [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"
