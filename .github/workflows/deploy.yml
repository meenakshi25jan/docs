name: AI English Teacher Deploy

on:
  workflow_run:
    workflows: [AI English Teacher CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: Run Alembic migrations against DATABASE_URL secret
        type: boolean
        default: true
      run_verify:
        description: Run post-deploy verification
        type: boolean
        default: true
      trigger_render:
        description: POST Render deploy hooks (if secrets configured)
        type: boolean
        default: true

concurrency:
  group: ai-english-teacher-deploy
  cancel-in-progress: false

env:
  DEPLOY_WEB_URL: ${{ vars.DEPLOY_WEB_URL || 'https://ai-english-teacher-web.onrender.com' }}
  DEPLOY_API_URL: ${{ vars.DEPLOY_API_URL || 'https://ai-english-teacher-api.onrender.com' }}

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          python3 ai-english-teacher/scripts/validate_render_config.py
          python3 ai-english-teacher/scripts/validate_environment.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Alembic migrations
        if: github.event.inputs.run_migrations != 'false'
        working-directory: ai-english-teacher/backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'migration-smoke-secret' }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "WARN: DATABASE_URL secret not set — skipping GitHub-side migrations"
            echo "Migrations will run via start.sh on Render"
          else
            pip install -r requirements-render.txt
            alembic upgrade head
            echo "Alembic migrations applied"
          fi

      - name: Trigger Render API deploy hook
        if: >
          (github.event_name == 'workflow_dispatch' && github.event.inputs.trigger_render != 'false') ||
          github.event_name == 'workflow_run'
        env:
          RENDER_DEPLOY_HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_API" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_API"
            echo "API deploy hook triggered"
          else
            echo "RENDER_DEPLOY_HOOK_API not set — relying on Render autoDeploy from main"

      - name: Wait for API healthy
        if: github.event.inputs.run_verify != 'false'
        env:
          WAIT_BASE_URL: ${{ env.DEPLOY_API_URL }}
          WAIT_PATHS: /health/live,/health,/health/ready
          WAIT_TIMEOUT: '600'
          WAIT_INTERVAL: '20'
        run: python3 ai-english-teacher/scripts/wait_for_healthy.py

      - name: Trigger Render Web deploy hook
        if: >
          (github.event_name == 'workflow_dispatch' && github.event.inputs.trigger_render != 'false') ||
          github.event_name == 'workflow_run'
        env:
          RENDER_DEPLOY_HOOK_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_WEB" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_WEB"
            echo "Web deploy hook triggered"
          else
            echo "RENDER_DEPLOY_HOOK_WEB not set — relying on Render autoDeploy from main"

      - name: Wait for Web healthy
        if: github.event.inputs.run_verify != 'false'
        env:
          WAIT_BASE_URL: ${{ env.DEPLOY_WEB_URL }}
          WAIT_PATHS: /
          WAIT_TIMEOUT: '600'
          WAIT_INTERVAL: '20'
        run: python3 ai-english-teacher/scripts/wait_for_healthy.py

      - name: Post-deploy verification (with retries)
        if: github.event.inputs.run_verify != 'false'
        env:
          TIMEOUT_SECONDS: '90'
          POST_DEPLOY_REGISTER_USER: 'true'
          POST_DEPLOY_REPORT: post_deploy_report.json
          DEPLOY_API_URL: ${{ env.DEPLOY_API_URL }}
          DEPLOY_WEB_URL: ${{ env.DEPLOY_WEB_URL }}
        run: |
          for i in 1 2 3 4 5; do
            echo "Verification attempt $i..."
            if python3 ai-english-teacher/scripts/post_deploy_verify.py; then
              exit 0
            fi
            sleep 30
          done
          echo "Post-deploy verification failed after retries"
          exit 1

      - name: Upload deployment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-report
          path: post_deploy_report.json
          if-no-files-found: ignore

      - name: Deployment success notification
        if: success()
        run: |
          echo "::notice title=Deploy Success::Production verification passed"
          echo "Web: $DEPLOY_WEB_URL"
          echo "API: $DEPLOY_API_URL"
