# AI English Teacher — Render Blueprint
# https://dashboard.render.com/blueprints

services:
  - type: web
    name: ai-english-teacher-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    autoDeploy: true
    rootDir: ai-english-teacher/backend
    buildCommand: pip install -r requirements-render.txt
    startCommand: bash ./start.sh
    healthCheckPath: /health/live
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: APP_ENV
        value: production
      - key: PYTHONPATH
        value: .
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: DATABASE_URL
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: GROK_MODEL
        value: grok-2-1212
      - key: OPENAI_API_KEY
        sync: false
      - key: WHISPER_MODEL
        value: whisper-1
      - key: CORS_ORIGINS
        value: https://ai-english-teacher-web.onrender.com,http://localhost:3000

  - type: web
    name: ai-english-teacher-web
    runtime: node
    region: oregon
    plan: free
    branch: main
    autoDeploy: true
    rootDir: ai-english-teacher/frontend
    buildCommand: rm -rf .next && npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_URL
        value: https://ai-english-teacher-api.onrender.com
      - key: API_PROXY_URL
        value: https://ai-english-teacher-api.onrender.com
