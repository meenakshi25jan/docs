# Render Blueprint — AI English Teacher (single source of truth)
# https://dashboard.render.com/blueprints
# Docs: docs/deployment/README.md

services:
  - type: web
    name: ai-english-teacher-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    autoDeploy: true
    rootDir: ai-english-teacher/backend
    buildCommand: |
      pip install -r requirements-render.txt
      mkdir -p migrations
      cp -r ../database/migrations/* migrations/ 2>/dev/null || true
    startCommand: python3 -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: DATABASE_MAX_OVERFLOW
        value: "5"
      - key: DATABASE_POOL_RECYCLE
        value: "280"
      - key: DATABASE_POOL_PRE_PING
        value: "true"
      - key: CORS_ORIGINS
        value: '["https://ai-english-teacher-web.onrender.com","http://localhost:3000"]'
      - key: SKIP_MIGRATIONS
        value: "true"
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: llama-3.1-8b-instant
      - key: WHISPER_MODEL
        value: whisper-large-v3-turbo
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: ai-english-teacher-web
    runtime: node
    region: oregon
    plan: free
    branch: main
    autoDeploy: true
    rootDir: ai-english-teacher/frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_URL
        value: /api/v1
      - key: API_PROXY_URL
        value: https://ai-english-teacher-api.onrender.com
